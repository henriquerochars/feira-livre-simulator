name: Reportar bug
description: Algo não funcionou como esperado na feira.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Liste os passos desde a abertura do jogo.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Resultado esperado e observado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Godot 4.7.2, macOS, Apple M4 Pro"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs e capturas
      description: Remova informações pessoais antes de anexar.
